# ClusterIP for clients inside the cluster (agent, kagent MCP tool server).
# In-cluster Bolt URI: bolt://neo4j.observability-memory.svc.cluster.local:7687
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels:
    app.kubernetes.io/name: neo4j
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
