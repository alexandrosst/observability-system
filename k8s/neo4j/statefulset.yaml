# Single-instance Neo4j Community. One replica only: Community has no clustering.
# Starting values for memory and storage are defaults to tune, not measured needs.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    app.kubernetes.io/name: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
    spec:
      # REQUIRED: the official image turns every NEO4J_* environment variable into a Neo4j
      # setting. Kubernetes injects NEO4J_PORT, NEO4J_SERVICE_HOST, ... for a Service named
      # "neo4j", which Neo4j rejects as unknown settings and exits. Disable service links.
      enableServiceLinks: false
      # Single-node cluster: no nodeSelector needed. On a multi-node cluster, pin the
      # database to a node the mutation experiments never touch, for example:
      #   nodeSelector:
      #     observability/role: memory
      securityContext:
        runAsUser: 7474      # neo4j user in the official image
        runAsGroup: 7474
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5.26.0-community   # 5.20+ is required for vector indexes
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            # Auth comes from the Secret generated by kustomize (see kustomization.yaml)
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-auth
                  key: NEO4J_AUTH
            # Downloaded at container start; needs outbound internet from the pod.
            - name: NEO4J_PLUGINS
              value: '["apoc", "graph-data-science"]'
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "gds.*,apoc.*"
            - name: NEO4J_dbms_security_procedures_allowlist
              value: "gds.*,apoc.*"
            - name: NEO4J_server_memory_heap_initial__size
              value: "1G"
            - name: NEO4J_server_memory_heap_max__size
              value: "1G"
            - name: NEO4J_server_memory_pagecache_size
              value: "512M"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          startupProbe:          # plugin download makes the first start slow
            tcpSocket:
              port: bolt
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: bolt
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bolt
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: plugins
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
